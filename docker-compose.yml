services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbit-server
    restart: unless-stopped
    hostname: rmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: redis-server
    restart: unless-stopped
    ports:
      - "6400:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: p2m-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin@rabbitmq:5672/%2F}
    ports:
      - "8100:8100"
    depends_on:
      - rabbitmq

  worker-ocr:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: p2m-worker-ocr
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin@rabbitmq:5672/%2F}
    command: ["sh", "/app/apps/api/scripts/run_worker.sh", "ocr"]
    depends_on:
      - rabbitmq

  worker-nlp:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: p2m-worker-nlp
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin@rabbitmq:5672/%2F}
    command: ["sh", "/app/apps/api/scripts/run_worker.sh", "nlp"]
    depends_on:
      - rabbitmq

  worker-embedding:
