    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin@rabbitmq:5672/%2F}
    command: ["sh", "/app/apps/api/scripts/run_worker.sh", "embedding"]
    depends_on:
      - rabbitmq

  worker-compliance:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: p2m-worker-compliance
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin@rabbitmq:5672/%2F}
