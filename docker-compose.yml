    command: ["sh", "/app/apps/api/scripts/run_worker.sh", "export"]
    depends_on:
      - rabbitmq

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: p2m-web
    restart: unless-stopped
    env_file:
      - apps/web/.env.example
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  rabbit_data:
  redis_data:
