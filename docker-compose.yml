    depends_on:
      - rabbitmq

  worker-rag:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: p2m-worker-rag
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8000}
